<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rating Hub — Sign In &amp; Verification</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script>
    // Immediate auth check: if already signed in, redirect directly to home.html
    try {
      var auth = JSON.parse(localStorage.getItem("questindex_auth_v1"));
      if (auth && auth.loggedIn) {
        window.location.replace("home.html");
      }
    } catch (_) {}
  </script>
</head>

<body>
  <div class="app-shell" style="min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;">
    <div id="site-header-mount"></div>

    <main class="container" style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
      <div class="hero-card" style="width:100%;max-width:480px;padding:36px 30px;box-shadow:var(--shadow-soft), var(--shadow-glow);">
        <div style="text-align:center;margin-bottom:24px;">
          <div class="brand-logo-box" style="margin:0 auto 14px;width:58px;height:58px;">
            <img src="logo.png" alt="Rating Hub Logo" class="brand-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex';" />
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
          <h1 class="section-title" style="font-size:1.8rem;margin-bottom:6px;">Welcome to Rating Hub</h1>
          <p style="color:var(--text-secondary);font-size:0.9rem;margin:0;">
            Sign in with your email to unlock personalized game reviews, search redeem badges, and explore top games.
          </p>
        </div>

        <!-- Step 1: Email and Password Form -->
        <form id="qi-gate-signin-form" style="display:flex;flex-direction:column;gap:16px;">
          <div class="form-field">
            <label for="qi-gate-email">Gmail / Email Address</label>
            <input type="email" id="qi-gate-email" placeholder="youremail@gmail.com" required autocomplete="email" />
          </div>

          <div class="form-field">
            <label for="qi-gate-password">Password</label>
            <input type="password" id="qi-gate-password" placeholder="Enter your password" required autocomplete="current-password" />
          </div>

          <button type="submit" class="btn-primary" style="width:100%;padding:12px;font-size:1rem;margin-top:6px;">
            Send Verification Code
          </button>
        </form>

        <!-- Step 2: Verification Code Input -->
        <form id="qi-gate-otp-form" style="display:none;flex-direction:column;gap:16px;">
          <div style="padding:14px;border-radius:12px;background:rgba(249,115,22,0.12);border:1px solid rgba(249,115,22,0.3);font-size:0.88rem;color:var(--text-primary);" id="qi-otp-notice">
            Verification code sent!
          </div>

          <div class="form-field">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <label for="qi-gate-code">Enter 5-Digit Verification Code</label>
              <button type="button" id="qi-gate-paste-btn" class="btn-ghost" style="padding:2px 8px;font-size:0.75rem;color:var(--accent-primary);border-color:var(--border-strong);">
                Paste Code
              </button>
            </div>
            <input type="text" id="qi-gate-code" placeholder="e.g. 64433" maxlength="6" required style="letter-spacing:0.25em;font-size:1.3rem;text-align:center;font-weight:800;" autocomplete="one-time-code" />
          </div>

          <button type="submit" class="btn-primary" style="width:100%;padding:12px;font-size:1rem;">
            Verify &amp; Enter Rating Hub
          </button>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
            <button type="button" class="btn-ghost" id="qi-gate-resend-btn" style="padding:6px 10px;font-size:0.82rem;">Resend Code</button>
            <button type="button" class="btn-ghost" id="qi-gate-back-btn" style="padding:6px 10px;font-size:0.82rem;">Back to Sign In</button>
          </div>
        </form>
      </div>
    </main>

    <div id="site-footer-mount"></div>
  </div>

  <script src="assets/js/games-data.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/chrome.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/app.js"></script>
</body>

</html>
