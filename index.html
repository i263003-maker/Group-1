<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestIndex — Game Review &amp; Search Index</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="site-header-mount"></div>
    <div id="utility-strip-mount"></div>

    <main class="container">
      <!-- Prototype Hero Section -->
      <section class="hero-section">
        <div class="hero-card">
          <div class="hero-top-row">
            <div class="hero-heading-box">
              <h1 class="hero-heading" id="qi-hero-heading">
                Discover Your Next Favourite Game<span class="blinking-cursor">_</span>
              </h1>
            </div>
            <div class="explore-cta-group">
              <button type="button" class="explore-dot-trigger" id="qi-explore-dot-btn" title="Hover or click to open circular sort options" aria-label="Explore Games Quick Sort Dot"></button>
              <div class="explore-radial-menu" id="qi-explore-radial" role="menu" aria-label="Explore Sort Options">
                <span class="radial-center-cap">Sort</span>
                <button type="button" class="radial-sort-node" data-pos="top" data-radial-mode="top">Sort top</button>
                <button type="button" class="radial-sort-node" data-pos="right" data-radial-mode="recent">Recent sort</button>
                <button type="button" class="radial-sort-node" data-pos="bottom" data-radial-mode="newlist">New sort</button>
                <button type="button" class="radial-sort-node" data-pos="left" data-radial-mode="trending">Trending</button>
              </div>
              <a href="explore.html" class="explore-cta-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
                <span>Explore Games</span>
              </a>
            </div>
          </div>

          <!-- Transitioning Promo Paragraph with Featured Store Icon (GOG.com) -->
          <div class="hero-promo-box">
            <p class="hero-promo-text" id="qi-hero-promo-text">
              Welcome to the imperial age, where castle falls, then step forward advance in technology lift the siege and tie your houses.
            </p>
            <div class="hero-promo-badge" id="qi-hero-promo-badge">
              <span>Age of Empires</span> &bull; <strong>GOG.com</strong>
            </div>
          </div>
        </div>
      </section>

      <!-- Prototype Feature Games Section -->
      <section style="padding-bottom:36px;">
        <div class="section-header">
          <h2 class="section-title">Feature Games</h2>
          <a href="search.html?q=Stronghold" style="color:var(--accent-primary);font-weight:700;font-size:0.9rem;">
            Quick Demo: Search &ldquo;Stronghold&rdquo; &rarr;
          </a>
        </div>
        <div class="feature-grid" id="qi-feature-grid"></div>
      </section>
    </main>

    <div id="site-footer-mount"></div>
  </div>

  <script src="assets/js/games-data.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/chrome.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
