<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rating Hub — Search Results</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="site-header-mount"></div>
    <div id="utility-strip-mount"></div>

    <main class="container">
      <div class="search-summary-head">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
          <div>
            <div style="font-size:0.85rem;color:var(--text-secondary);font-weight:700;">Search Result:</div>
            <div class="search-query-quote" id="qi-result-query">&ldquo;Stronghold&rdquo;</div>
            <div style="font-size:0.95rem;font-weight:700;" id="qi-result-count">Result Count: 5</div>
          </div>

          <form id="qi-results-inline-form" class="explore-search-bar" style="max-width:380px;">
            <input type="text" id="qi-results-inline-input" placeholder="Search index (e.g. Stronghold)..." />
            <button type="submit" class="btn-primary" style="padding:7px 14px;font-size:0.82rem;">Search</button>
          </form>
        </div>
      </div>

      <div class="search-results-list" id="qi-search-results-list"></div>
    </main>

    
        <span style="font-size:0.75rem;padding:4px 10px;border-radius:999px;background:rgba(34,197,94,0.18);color:var(--accent-emerald);font-weight:700;">
          AUTOPLAYING TRAILER
        </span>
      </div>
    </div>

    <div id="site-footer-mount"></div>
  </div>

  <script src="assets/js/games-data.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/chrome.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
