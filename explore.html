<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestIndex — Explore Games</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="site-header-mount"></div>
    <div id="utility-strip-mount"></div>

    <main class="container">
      <div class="page-title-row">
        <div>
          <h1 class="section-title" style="font-size:1.7rem;">Explore Games Page</h1>
          <span class="feature-pill" id="qi-explore-mode-label" style="display:none;margin-top:6px;"></span>
        </div>
        <div class="explore-search-stack">
          <div class="explore-search-bar">
            <button type="button" class="explore-search-icon-btn" id="qi-explore-search-icon-btn" title="Hover or click to toggle Sort panel" aria-label="Search and toggle Sort panel">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
            <input type="text" id="qi-explore-search" placeholder="Filter explored games by title or genre..." />
          </div>

          <!-- Hovering towards search icon reveals tilted sort navigator arrow sign -->
          <div class="sort-zone">
            <button type="button" class="sort-trigger-wrap" id="qi-sort-toggle" aria-expanded="false">
              <span class="sort-tilted-arrow" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 9l6 6 6-6"></path>
                </svg>
              </span>
              <span class="sort-hover-label">Sort Navigator</span>
            </button>

            <div class="sort-panel" id="qi-sort-panel">
              <select class="sort-select" id="qi-filter-general" aria-label="General Genre Filter">
                <option value="All">General (All)</option>
                <option value="Action">Action</option>
                <option value="Strategy">Strategy</option>
                <option value="RPG">RPG</option>
                <option value="Shooter">Shooter</option>
                <option value="Board & Chess">Board &amp; Chess</option>
              </select>

              <select class="sort-select" id="qi-filter-platform" aria-label="Platform Filter">
                <option value="All">Platform (All)</option>
                <option value="PC">PC</option>
                <option value="PlayStation">PlayStation</option>
                <option value="Xbox">Xbox</option>
                <option value="Switch">Switch</option>
                <option value="Web">Web</option>
              </select>

              <select class="sort-select" id="qi-filter-date" aria-label="Release Date Filter">
                <option value="All">Date (All)</option>
                <option value="2024-2026">2024 - 2026</option>
                <option value="2020-2023">2020 - 2023</option>
                <option value="Classic">Classic</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- 8-Slot Grid (6 Games + 2 Reserved Empty Ad Panels) -->
      <div class="explore-grid" id="qi-explore-grid"></div>
    </main>

    <div id="site-footer-mount"></div>
  </div>

  <script src="assets/js/games-data.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/chrome.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
