<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../">
  <title>Compare Games — Rating Hub</title>
  <link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/chrome.css"><link rel="stylesheet" href="css/app.css">
</head>
<body data-page="compare">
  <div id="site-header-mount"></div><div id="utility-strip-mount"></div>
  <main class="container page-main">
    <header class="page-heading"><p class="eyebrow">// Make the next pick count</p><h1>Compare two games</h1><p>Choose any titles from the unified index—including classic Steam games—and weigh their ratings, release eras, platforms, and genres.</p></header>
    <div class="compare-selection">
      <section class="compare-slot"><p class="eyebrow">Game 01</p><h2>First pick</h2><div class="suggestion-box"><label class="sr-only" for="game-a-input">Search first game</label><input class="control" id="game-a-input" type="search" placeholder="Search any game..." autocomplete="off"><div class="suggestion-list" id="game-a-suggestions" hidden></div></div><div id="game-a-preview"></div></section>
      <div class="vs-mark" aria-hidden="true">VS</div>
      <section class="compare-slot"><p class="eyebrow">Game 02</p><h2>Second pick</h2><div class="suggestion-box"><label class="sr-only" for="game-b-input">Search second game</label><input class="control" id="game-b-input" type="search" placeholder="Search any game..." autocomplete="off"><div class="suggestion-list" id="game-b-suggestions" hidden></div></div><div id="game-b-preview"></div></section>
    </div>
    <div class="compare-controls"><p class="notice" id="compare-status" aria-live="polite">Choose two different games to start.</p><button class="button" type="button" id="compare-start" disabled>Compare games →</button></div>
  </main>
  <div id="site-footer-mount"></div><div id="modal-root"></div>
  <script src="credentials/users-db.js"></script><script src="js/games-data.js"></script><script src="js/state.js"></script><script src="js/search.js"></script><script src="js/chrome.js"></script><script src="js/auth.js"></script><script src="js/game-page.js"></script><script src="js/compare.js"></script><script src="js/developers.js"></script><script src="js/app.js"></script>
</body>
</html>
