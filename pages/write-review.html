<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../">
  <meta name="description" content="Write a thoughtful Rating Hub game review.">
  <title>Write a Review — Rating Hub</title>
  <link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/chrome.css"><link rel="stylesheet" href="css/app.css">
</head>
<body data-page="write-review">
  <div id="site-header-mount"></div><div id="utility-strip-mount"></div>
  <main class="container page-main">
    <div id="write-review-missing" class="empty-state" hidden><h2>Choose a game to review</h2><p>Open any title from the catalog to write a review.</p><a class="button" href="pages/search.html">Find a game →</a></div>
    <div id="write-review-content" hidden>
      <header class="page-heading"><p class="eyebrow">// Your experience matters</p><h1>Write a review</h1><p id="write-review-intro">Tell other players what makes this game worth their time.</p></header>
      <section class="write-review-layout">
        <aside class="panel write-review-game"><img id="write-review-cover" alt=""><p class="eyebrow" id="write-review-meta"></p><h2 id="write-review-title"></h2><a id="write-review-back" href="pages/game.html">View game details →</a></aside>
        <section class="panel">
          <div class="notice" id="write-review-auth-message" hidden></div>
          <form class="review-composer" id="write-review-form">
            <div class="review-composer-grid">
              <label class="field">Your rating <span class="row"><input id="write-review-score" type="range" min="1" max="10" step=".5" value="8"><strong class="accent" id="write-review-score-value">8 / 10</strong></span></label>
              <label class="field">Platform<select id="write-review-platform"></select></label>
            </div>
            <label class="field">Review headline<input id="write-review-headline" required minlength="4" maxlength="90" placeholder="Sum up your experience"></label>
            <label class="field">Your review<textarea id="write-review-body" required minlength="30" maxlength="1200" placeholder="Share what you liked, what could be better, and who this game is for."></textarea></label>
            <div class="review-composer-grid">
              <label class="field">What worked for you?<textarea id="write-review-pros" maxlength="300" placeholder="Optional · one point per line"></textarea></label>
              <label class="field">What could be better?<textarea id="write-review-cons" maxlength="300" placeholder="Optional · one point per line"></textarea></label>
            </div>
            <div class="notice" id="write-review-message" aria-live="polite" hidden></div>
            <div class="actions-row"><button class="button" type="submit">Publish review →</button><a class="button-secondary" id="write-review-cancel" href="pages/search.html">Cancel</a></div>
          </form>
        </section>
      </section>
    </div>
  </main>
  <div id="site-footer-mount"></div><div id="modal-root"></div>
  <script src="credentials/users-db.js"></script><script src="js/games-data.js"></script><script src="js/state.js"></script><script src="js/search.js"></script><script src="js/chrome.js"></script><script src="js/auth.js"></script><script src="js/game-page.js"></script><script src="js/compare.js"></script><script src="js/developers.js"></script><script src="js/app.js"></script>
</body>
</html>
