<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../">
  <title>Search Games — Rating Hub</title>
  <link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/chrome.css"><link rel="stylesheet" href="css/app.css">
</head>
<body data-page="search">
  <div id="site-header-mount"></div><div id="utility-strip-mount"></div>
  <main class="container page-main">
    <header class="page-heading"><p class="eyebrow">// One catalog, every era</p><h1>Search the index</h1><p>Search by title, era, genre, tags, developer, publisher, platform, or rating. Classic Steam releases are included alongside the merged community catalog.</p></header>
    <form class="filters" id="search-form">
      <label class="field">Game or keyword<input id="search-query" type="search" placeholder="Try Stronghold, 2002, RPG..."></label>
      <label class="field">Genre<select id="filter-genre"><option value="all">All genres</option></select></label>
      <label class="field">Platform<select id="filter-platform"><option value="all">All platforms</option></select></label>
      <label class="field">Era<select id="filter-era"><option value="all">All years</option><option value="classic">Classic · before 2015</option><option value="2015-2019">2015–2019</option><option value="recent">2020 and newer</option><option value="unknown">Year not listed</option></select></label>
      <label class="field">Sort<select id="filter-sort"><option value="rating-desc">Top rated</option><option value="relevance">Best match</option><option value="year-desc">Newest first</option><option value="year-asc">Oldest first</option><option value="rating-asc">Lowest rated</option><option value="title">Title A–Z</option></select></label>
    </form>
    <div class="result-summary"><span id="search-summary">Loading the catalog…</span><button class="button-quiet" id="clear-filters" type="button">Clear filters</button></div>
    <div class="search-results" id="search-results"></div>
  </main>
  <div id="site-footer-mount"></div><div id="modal-root"></div>
  <script src="credentials/users-db.js"></script><script src="js/games-data.js"></script><script src="js/state.js"></script><script src="js/search.js"></script><script src="js/chrome.js"></script><script src="js/auth.js"></script><script src="js/game-page.js"></script><script src="js/compare.js"></script><script src="js/developers.js"></script><script src="js/app.js"></script>
</body>
</html>
