<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameHub — My Profile</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-page="profile">
  <div class="page-shell">
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <div class="navbar-inner">
        <a href="../index.html" class="brand" aria-label="GameHub Home">
          <span class="brand-icon" aria-hidden="true">🎮</span>
          <span class="brand-text">GAMEHUB</span>
        </a>

        <button
          type="button"
          class="nav-toggle"
          id="navToggle"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="nav-links" id="navLinks" aria-label="Primary">
          <a href="../index.html" class="nav-link">Home</a>
          <a href="#explore" class="nav-link" data-nav="Explore Games">Explore Games</a>
          <a href="#top-rated" class="nav-link" data-nav="Top Rated">Top Rated</a>
          <a href="#compare" class="nav-link" data-nav="Compare">Compare</a>
          <a href="#about" class="nav-link" data-nav="About">About</a>
        </nav>

        <div class="nav-auth">
          <a href="profile.html" class="nav-pill" id="navAuthLink">Player123</a>
        </div>
      </div>
    </header>

    <!-- Notification Banner -->
    <div class="demo-toast hidden" id="demoToast" role="status" aria-live="polite">
      <div class="demo-toast-content">
        <span class="demo-badge">GAMEHUB</span>
        <span id="demoToastMessage"></span>
      </div>
      <button type="button" class="demo-toast-close" id="demoToastClose" aria-label="Dismiss notification">✕</button>
    </div>

    <main class="main-content">
      <!-- ==================== PAGE 3: USER PROFILE VIEW ==================== -->
      <section class="view active" id="view-profile" aria-labelledby="profileHeading">
        <div class="profile-container">
          <h1 class="section-heading" id="profileHeading">My Profile</h1>

          <div class="profile-card">
            <div class="profile-header">
              <div class="avatar-circle" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <div class="profile-identity">
                <div class="profile-name-row">
                  <h2 id="profileUsername">Player123</h2>
                  <span class="verified-pill" id="profileVerifiedBadge">✓ Verified</span>
                </div>
                <p class="profile-tagline" id="profileTagline">Gaming enthusiast</p>
                <p class="profile-welcome" id="profileWelcome">Welcome to your profile!</p>
                <p class="profile-meta" id="profileMeta"></p>
              </div>
            </div>

            <div class="stats-grid">
              <div class="stat-card">
                <span class="stat-number" id="statReviews">12</span>
                <span class="stat-label">Total Reviews</span>
              </div>
              <div class="stat-card">
                <span class="stat-number" id="statSaved">08</span>
                <span class="stat-label">Saved Games</span>
              </div>
            </div>

            <button type="button" class="btn btn-primary btn-block" id="editProfileBtn">
              EDIT PROFILE
            </button>

            <div class="recent-reviews">
              <h3>Recent Reviews</h3>
              <div id="recentReviewsList" class="reviews-list"></div>
            </div>

            <button type="button" class="btn btn-logout btn-block" id="logoutBtn">
              LOGOUT
            </button>
          </div>
        </div>
      </section>

      <!-- ==================== EDIT PROFILE VIEW ==================== -->
      <section class="view" id="view-edit-profile" aria-labelledby="editProfileHeading">
        <div class="profile-container">
          <h1 class="section-heading" id="editProfileHeading">Edit Profile</h1>

          <div class="profile-card">
            <form id="editProfileForm" novalidate>
              <div class="form-alert hidden" id="editProfileAlert" role="alert"></div>

              <div class="edit-grid">
                <div class="form-group">
                  <label for="editFullName">Full Name</label>
                  <input type="text" id="editFullName" required />
                </div>

                <div class="form-group">
                  <label for="editUsername">Username</label>
                  <input type="text" id="editUsername" required />
                </div>

                <div class="form-group">
                  <label for="editAge">Age</label>
                  <input type="number" id="editAge" min="13" max="120" placeholder="e.g. 22" />
                </div>

                <div class="form-group">
                  <label>Gender</label>
                  <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="editGender" value="Male" /> Male</label>
                    <label class="radio-label"><input type="radio" name="editGender" value="Female" /> Female</label>
                    <label class="radio-label"><input type="radio" name="editGender" value="Other" /> Other</label>
                  </div>
                </div>

                <div class="form-group">
                  <label for="editCity">Current City</label>
                  <input type="text" id="editCity" placeholder="e.g. Islamabad" />
                </div>

                <div class="form-group">
                  <label for="editTagline">Gamer Title / Rank</label>
                  <input type="text" id="editTagline" placeholder="e.g. Gaming enthusiast" />
                </div>

                <div class="form-group">
                  <label for="editEmail">Email</label>
                  <input type="email" id="editEmail" required />
                </div>

                <div class="form-group">
                  <label for="editPhone">Phone #</label>
                  <input type="tel" id="editPhone" placeholder="e.g. 555-123-4567" />
                </div>
              </div>

              <div class="form-group">
                <label for="editAbout">About Me</label>
                <textarea id="editAbout" rows="3" placeholder="Tell the community about your favorite genres and games..."></textarea>
              </div>

              <div class="edit-actions">
                <button type="submit" class="btn btn-primary">SAVE CHANGES</button>
                <button type="button" class="btn btn-secondary" id="backToProfileBtn">BACK TO PROFILE</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-links">
        <a href="#about">About GameHub</a>
        <span>|</span>
        <a href="#contact">Contact</a>
        <span>|</span>
        <a href="#guidelines">Community Guidelines</a>
        <span>|</span>
        <a href="#privacy">Privacy Policy</a>
      </div>
      <p class="footer-copy">&copy; 2026 GameHub</p>
    </footer>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
