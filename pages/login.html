<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../">
  <title>Log In — Rating Hub</title>
  <link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/chrome.css"><link rel="stylesheet" href="css/app.css">
</head>
<body data-page="login">
  <div id="site-header-mount"></div><div id="utility-strip-mount"></div>
  <main class="container page-main">
    <section class="auth-page">
      <div class="panel"><p class="eyebrow">// Welcome back</p><h1>Log in</h1><p class="muted">Sign in to sync your profile, wishlist, and community contributions on this browser.</p>
        <form class="auth-form" id="login-form" novalidate>
          <label class="field">Email or username<input id="login-identity" required autocomplete="username" placeholder="you@example.com"></label>
          <label class="field">Password<input id="login-password" type="password" required autocomplete="current-password"></label>
          <div class="notice" id="login-message" aria-live="polite" hidden></div>
          <button class="button" type="submit">Log in →</button>
        </form>
        <p class="auth-footer">New to Rating Hub? <a href="pages/signup.html">Create an account</a></p>
        <p class="muted" style="font-size:.76rem;margin:16px 0 0">Demo: <strong>Mario12</strong> / <strong>playmore123</strong></p>
      </div>
    </section>
  </main>
  <div id="site-footer-mount"></div><div id="modal-root"></div>
  <script src="credentials/users-db.js"></script><script src="js/games-data.js"></script><script src="js/state.js"></script><script src="js/search.js"></script><script src="js/chrome.js"></script><script src="js/auth.js"></script><script src="js/game-page.js"></script><script src="js/compare.js"></script><script src="js/developers.js"></script><script src="js/app.js"></script>
</body>
</html>
